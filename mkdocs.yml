site_name: Saibug
site_url: https://saibug.org
site_description: "Saibug - GNU/Linux system engineer blog: Linux, virtualization, containers and Kubernetes"
site_author: Seddik Alaoui Ismaili
repo_url: https://github.com/saibug/saibug.org

theme:
  name: material
  favicon: assets/images/favicon.ico
  font: false
  icon:
    logo: material/human-greeting
  features:
    - navigation.tabs
    - navigation.expand
    - navigation.sections
    - toc.integrate
    - content.code.copy
    - navigation.instant
extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/saibug
    - icon: material/rss
      link: https://saibug.org/feed_rss_created.xml
      name: RSS feed

markdown_extensions:
  - attr_list
  - admonition
  - meta
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji 
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences

nav:
  - Tech Blog:
      - Virtualizations:
          - posts/Vagrant-getting-started.md
      - Containers:
          - posts/Kind-local-kubernetes-cluster.md
          - posts/Kubernetes-by-the-hard-way.md
  - Events:
      - 2025:
          - events/2025-PyconFR.md
plugins:
  - awesome-pages:
      strict: false
  - redirects
  - search
  - git-revision-date-localized
  - social
  - rss:
      match_path: "(posts|events)/.*"
      date_from_meta:
        as_creation: git


